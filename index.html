<script type="module">

const GITHUB_USER = "FloppyDisk-OSC";
const GITHUB_REPO = "books";
const PDF_FOLDER = "pdfs";

import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

let books = [];
let currentBookIndex = -1;
let currentPDF = null;
let currentPage = 1;
let totalPages = 0;
let zoom = 1.5;
let showStarredOnly = false;

let stars =
    JSON.parse(
        localStorage.getItem("bookStars") || "{}"
    );

let bookmarks =
    JSON.parse(
        localStorage.getItem("bookBookmarks") || "{}"
    );

const booksElement =
    document.getElementById("books");

const searchElement =
    document.getElementById("search");

const bookCount =
    document.getElementById("bookCount");

const reader =
    document.getElementById("reader");

const readerTitle =
    document.getElementById("readerTitle");

const pdfContainer =
    document.getElementById("pdfContainer");

const pdfCanvas =
    document.getElementById("pdfCanvas");

const pdfLoading =
    document.getElementById("pdfLoading");

const pageInput =
    document.getElementById("pageInput");

const totalPagesElement =
    document.getElementById("totalPages");

async function loadBooks() {

    booksElement.innerHTML = `
        <div class="message">
            Loading your bookshelf...
        </div>
    `;

    try {

        const apiURL =
            `https://api.github.com/repos/` +
            `${GITHUB_USER}/${GITHUB_REPO}/contents/${PDF_FOLDER}`;

        const response =
            await fetch(apiURL);

        if (!response.ok) {
            throw new Error(
                `GitHub API returned ${response.status}`
            );
        }

        const files =
            await response.json();

        books =
            files
                .filter(file =>
                    file.type === "file" &&
                    file.name
                        .toLowerCase()
                        .endsWith(".pdf")
                )
                .map(file => ({
                    name:
                        file.name
                            .replace(/\.pdf$/i, ""),
                    filename:
                        file.name,
                    url:
                        `https://${GITHUB_USER}.github.io/` +
                        `${GITHUB_REPO}/` +
                        `${PDF_FOLDER}/` +
                        encodeURIComponent(file.name)
                }))
                .sort((a, b) =>
                    a.name.localeCompare(b.name)
                );

        renderBooks();

    } catch (error) {

        console.error(error);

        booksElement.innerHTML = `
            <div class="message">
                <h2>Couldn't load the bookshelf</h2>
                <p>Check your repository configuration.</p>
                <p>${escapeHTML(error.message)}</p>
            </div>
        `;

        bookCount.textContent =
            "Unable to load books";
    }
}

function renderBooks() {

    const query =
        searchElement.value
            .trim()
            .toLowerCase();

    const visibleBooks =
        books.filter(book => {

            const matchesSearch =
                book.name
                    .toLowerCase()
                    .includes(query);

            const matchesStar =
                !showStarredOnly ||
                stars[book.filename];

            return matchesSearch &&
                   matchesStar;
        });

    bookCount.textContent =
        `${visibleBooks.length} ` +
        `${visibleBooks.length === 1
            ? "book"
            : "books"}`;

    if (!visibleBooks.length) {

        booksElement.innerHTML = `
            <div class="message">
                <h2>No books found</h2>
                <p>Try a different search.</p>
            </div>
        `;

        return;
    }

    booksElement.innerHTML = "";

    visibleBooks.forEach(book => {

        const actualIndex =
            books.indexOf(book);

        const card =
            document.createElement("div");

        card.className = "book";

        const cover =
            document.createElement("div");

        cover.className =
            "book-cover";

        cover.textContent =
            book.name;

        const info =
            document.createElement("div");

        info.className =
            "book-info";

        const name =
            document.createElement("div");

        name.className =
            "book-name";

        name.textContent =
            book.name;

        const actions =
            document.createElement("div");

        actions.className =
            "book-actions";

        const star =
            document.createElement("button");

        star.className =
            stars[book.filename]
                ? "star active"
                : "star";

        star.textContent =
            stars[book.filename]
                ? "⭐ Starred"
                : "☆ Star";

        const bookmark =
            document.createElement("button");

        bookmark.className =
            bookmarks[book.filename]
                ? "bookmark active"
                : "bookmark";

        bookmark.textContent =
            bookmarks[book.filename]
                ? "🔖 Saved"
                : "🔖 Bookmark";

        star.onclick = event => {
            event.stopPropagation();
            toggleStar(book.filename);
            renderBooks();
        };

        bookmark.onclick = event => {
            event.stopPropagation();
            toggleBookmark(book.filename);
            renderBooks();
        };

        actions.appendChild(star);
        actions.appendChild(bookmark);

        info.appendChild(name);
        info.appendChild(actions);

        card.appendChild(cover);
        card.appendChild(info);

        card.onclick = () =>
            openBook(actualIndex);

        booksElement.appendChild(card);
    });
}

function toggleStar(filename) {

    stars[filename] =
        !stars[filename];

    localStorage.setItem(
        "bookStars",
        JSON.stringify(stars)
    );
}

function toggleBookmark(filename) {

    bookmarks[filename] =
        !bookmarks[filename];

    localStorage.setItem(
        "bookBookmarks",
        JSON.stringify(bookmarks)
    );
}

async function openBook(index) {

    if (
        index < 0 ||
        index >= books.length
    ) {
        return;
    }

    currentBookIndex =
        index;

    const book =
        books[index];

    readerTitle.textContent =
        book.name;

    reader.classList.add("active");

    document.body.style.overflow =
        "hidden";

    pdfCanvas.style.display =
        "none";

    pdfLoading.style.display =
        "block";

    pdfLoading.textContent =
        "Loading PDF...";

    currentPage =
        Number(
            localStorage.getItem(
                "page_" + book.filename
            ) || 1
        );

    zoom = 1.5;

    try {

        currentPDF =
            await pdfjsLib
                .getDocument(book.url)
                .promise;

        totalPages =
            currentPDF.numPages;

        currentPage =
            Math.max(
                1,
                Math.min(
                    currentPage,
                    totalPages
                )
            );

        totalPagesElement.textContent =
            totalPages;

        pageInput.max =
            totalPages;

        await renderCurrentPage();

        updateReaderButtons();

    } catch (error) {

        console.error(error);

        pdfLoading.innerHTML = `
            <h2>Couldn't open this PDF</h2>
            <p>${escapeHTML(error.message)}</p>
        `;
    }
}

async function renderCurrentPage() {

    if (!currentPDF)
        return;

    pdfLoading.style.display =
        "block";

    pdfLoading.textContent =
        `Loading page ${currentPage}...`;

    pdfCanvas.style.display =
        "none";

    const page =
        await currentPDF.getPage(
            currentPage
        );

    const viewport =
        page.getViewport({
            scale: zoom
        });

    pdfCanvas.width =
        viewport.width;

    pdfCanvas.height =
        viewport.height;

    const context =
        pdfCanvas.getContext("2d");

    await page.render({
        canvasContext:
            context,
        viewport:
            viewport
    }).promise;

    pdfLoading.style.display =
        "none";

    pdfCanvas.style.display =
        "block";

    pageInput.value =
        currentPage;

    updateReaderButtons();

    const book =
        books[currentBookIndex];

    if (book) {

        localStorage.setItem(
            "page_" + book.filename,
            currentPage
        );
    }

    pdfContainer.scrollTop = 0;
}

async function changePage(amount) {

    const newPage =
        currentPage + amount;

    if (
        newPage < 1 ||
        newPage > totalPages
    ) {
        return;
    }

    currentPage =
        newPage;

    await renderCurrentPage();
}

document.getElementById(
    "previousPage"
).onclick =
    () => changePage(-1);

document.getElementById(
    "nextPage"
).onclick =
    () => changePage(1);

pageInput.addEventListener(
    "change",
    async () => {

        let page =
            Number(pageInput.value);

        if (!Number.isFinite(page))
            page = 1;

        page =
            Math.max(
                1,
                Math.min(
                    page,
                    totalPages
                )
            );

        currentPage =
            page;

        await renderCurrentPage();
    }
);

document.getElementById(
    "zoomIn"
).onclick = async () => {

    zoom =
        Math.min(
            zoom + .25,
            3
        );

    await renderCurrentPage();
};

document.getElementById(
    "zoomOut"
).onclick = async () => {

    zoom =
        Math.max(
            zoom - .25,
            .5
        );

    await renderCurrentPage();
};

document.getElementById(
    "previousBook"
).onclick = () => {

    if (currentBookIndex > 0) {

        openBook(
            currentBookIndex - 1
        );
    }
};

document.getElementById(
    "nextBook"
).onclick = () => {

    if (
        currentBookIndex <
        books.length - 1
    ) {

        openBook(
            currentBookIndex + 1
        );
    }
};

document.getElementById(
    "readerStar"
).onclick = () => {

    const book =
        books[currentBookIndex];

    if (!book)
        return;

    toggleStar(book.filename);
    updateReaderButtons();
};

document.getElementById(
    "readerBookmark"
).onclick = () => {

    const book =
        books[currentBookIndex];

    if (!book)
        return;

    toggleBookmark(book.filename);
    updateReaderButtons();
};

function updateReaderButtons() {

    const book =
        books[currentBookIndex];

    if (!book)
        return;

    document.getElementById(
        "readerStar"
    ).textContent =
        stars[book.filename]
            ? "⭐"
            : "☆";

    document.getElementById(
        "readerBookmark"
    ).textContent =
        bookmarks[book.filename]
            ? "🔖"
            : "📑";

    document.getElementById(
        "previousBook"
    ).disabled =
        currentBookIndex <= 0;

    document.getElementById(
        "nextBook"
    ).disabled =
        currentBookIndex >=
        books.length - 1;

    document.getElementById(
        "previousPage"
    ).disabled =
        currentPage <= 1;

    document.getElementById(
