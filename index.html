<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookshelf</title>

<style>
:root {
    color-scheme: dark;
    font-family: system-ui, sans-serif;
    background: #111318;
    color: #f2f3f7;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
    color: inherit;
    background: #292d38;
    border: 1px solid #414653;
    border-radius: 9px;
    padding: 10px 14px;
}

button:hover {
    background: #3a4050;
}

button:disabled {
    opacity: 0.4;
    cursor: default;
}

header {
    padding: 22px;
    background: #191c24;
    border-bottom: 1px solid #343844;
}

h1 {
    margin: 0 0 14px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

input {
    color: inherit;
    background: #222630;
    border: 1px solid #414653;
    border-radius: 9px;
    padding: 11px;
}

#search {
    flex: 1;
    min-width: 160px;
}

#status {
    color: #b5bdcd;
    padding: 0 22px;
    overflow-wrap: anywhere;
}

#library {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 14px;
    padding: 22px;
}

.card {
    min-width: 0;
    background: #1c2029;
    border: 1px solid #343946;
    border-radius: 13px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.cover {
    height: 125px;
    display: grid;
    place-items: center;
    background: #292f40;
    border-radius: 8px;
    font-size: 48px;
}

.book-title {
    overflow-wrap: anywhere;
    font-weight: 650;
}

.card-actions {
    display: flex;
    gap: 7px;
    margin-top: auto;
}

.card-actions button {
    flex: 1;
}

.starred {
    color: #ffd65a;
}

#reader {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: #111318;
    display: none;
    flex-direction: column;
}

#reader.active {
    display: flex;
}

#readerHeader,
#toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: #191c24;
}

#readerTitle {
    flex: 1;
    min-width: 100px;
    overflow-wrap: anywhere;
    font-weight: 650;
}

#pageArea {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 14px;
}

#pdfCanvas {
    display: block;
    max-width: 100%;
    height: auto;
    background: white;
    box-shadow: 0 3px 20px #0008;
}

#pageNumber {
    width: 75px;
    text-align: center;
}

#pageInfo {
    color: #c0c6d3;
}

#toolbar {
    justify-content: center;
}

#errorBox {
    display: none;
    margin: 20px 22px;
    padding: 16px;
    border: 1px solid #803d3d;
    border-radius: 10px;
    background: #2a1717;
    color: #ffb4b4;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

@media(max-width: 500px) {
    header {
        padding: 16px;
    }

    #library {
        padding: 14px;
        gap: 10px;
    }

    #readerHeader {
        justify-content: center;
    }

    #readerTitle {
        flex-basis: 100%;
    }

    #toolbar {
        gap: 6px;
    }

    #toolbar button {
        padding: 9px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 My Bookshelf</h1>

    <div class="controls">
        <input
            id="search"
            type="search"
            placeholder="Search your books..."
        >

        <button id="starFilter">
            ☆ Starred
        </button>

        <button id="refresh">
            ↻ Refresh
        </button>
    </div>
</header>

<p id="status">
    Loading your library...
</p>

<div id="errorBox"></div>

<main id="library"></main>

<section id="reader">

    <div id="readerHeader">

        <button id="closeReader">
            ✕ Close
        </button>

        <button id="prevBook">
            ← Book
        </button>

        <div id="readerTitle"></div>

        <button id="bookStar">
            ☆
        </button>

        <button id="bookBookmark">
            🔖
        </button>

        <button id="nextBook">
            Book →
        </button>

    </div>

    <div id="pageArea">
        <canvas id="pdfCanvas"></canvas>
    </div>

    <div id="toolbar">

        <button id="prevPage">
            ← Page
        </button>

        <input
            id="pageNumber"
            type="number"
            min="1"
            value="1"
        >

        <span id="pageInfo">
            / 0
        </span>

        <button id="nextPage">
            Page →
        </button>

        <button id="zoomOut">
            −
        </button>

        <span id="zoomLabel">
            100%
        </span>

        <button id="zoomIn">
            +
        </button>

    </div>

</section>

<script type="module">

import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


const DRIVE_FOLDER_ID =
    "1qiYYMIgJG3M02FriZwiV5DRfBzDXoMx8";


const GOOGLE_API_KEY =
    "PASTE_YOUR_API_KEY_HERE";


const library =
    document.getElementById("library");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("errorBox");

const reader =
    document.getElementById("reader");

const canvas =
    document.getElementById("pdfCanvas");

const ctx =
    canvas.getContext("2d");


let books = [];

let currentIndex = -1;

let pdf = null;

let loadingTask = null;

let renderTask = null;

let page = 1;

let zoom = 1;

let starredOnly = false;

let renderVersion = 0;


const stars = new Set(
    JSON.parse(
        localStorage.getItem("bookStars") || "[]"
    )
);


const bookmarks =
    JSON.parse(
        localStorage.getItem("bookBookmarks") || "{}"
    );


function saveStars() {

    localStorage.setItem(
        "bookStars",
        JSON.stringify([...stars])
    );

}


function saveBookmarks() {

    localStorage.setItem(
        "bookBookmarks",
        JSON.stringify(bookmarks)
    );

}


function savedPage(book) {

    return Number(
        localStorage.getItem(
            "page_" + book.id
        )
    ) || 1;

}


function showError(message) {

    errorBox.style.display = "block";

    errorBox.textContent = message;

}


function clearError() {

    errorBox.style.display = "none";

    errorBox.textContent = "";

}


async function loadBooks() {

    clearError();

    library.innerHTML = "";

    status.textContent =
        "Loading PDFs from Google Drive...";

    const refresh =
        document.getElementById("refresh");

    refresh.disabled = true;


    if (
        !GOOGLE_API_KEY ||
        GOOGLE_API_KEY ===
        "AIzaSyC4VOkoBjBzZIoipsDQbAAVWHgeimz0P14"
    ) {

        status.textContent =
            "Google API key has not been added.";

        showError(
            "Open index.html and replace " +
            "\"PASTE_YOUR_API_KEY_HERE\" " +
            "with your Google Cloud API key."
        );

        refresh.disabled = false;

        return;

    }


    try {

        let allFiles = [];

        let nextPageToken = "";


        do {

            const params =
                new URLSearchParams({

                    q:
                        `'${DRIVE_FOLDER_ID}' in parents ` +
                        `and trashed = false ` +
                        `and mimeType = 'application/pdf'`,

                    fields:
                        "nextPageToken,files(id,name,mimeType)",

                    pageSize:
                        "1000",

                    orderBy:
                        "name",

                    key:
                        GOOGLE_API_KEY

                });


            if (nextPageToken) {

                params.set(
                    "pageToken",
                    nextPageToken
                );

            }


            const url =
                "https://www.googleapis.com/drive/v3/files?" +
                params.toString();


            const response =
                await fetch(url);


            let data;

            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            if (!response.ok) {

                const googleMessage =
                    data?.error?.message ||
                    "Google did not provide an error message.";

                const googleReason =
                    data?.error?.errors?.[0]?.reason ||
                    "Unknown reason";


                throw new Error(
                    "Google Drive API returned HTTP " +
                    response.status +
                    "\n\n" +
                    googleMessage +
                    "\n\nReason: " +
                    googleReason
                );

            }


            allFiles.push(
                ...(data.files || [])
            );


            nextPageToken =
                data.nextPageToken || "";


        } while (nextPageToken);


        books =
            allFiles
                .filter(
                    file =>
                        file.mimeType ===
                        "application/pdf"
                )
                .sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name
                        )
                );


        renderLibrary();


        if (books.length) {

            status.textContent =
                books.length +
                " PDF" +
                (books.length === 1 ? "" : "s") +
                " in your library";

        } else {

            status.textContent =
                "No PDFs found.";

            showError(
                "Google Drive connected successfully, " +
                "but no public PDFs were found inside " +
                "the specified folder.\n\n" +
                "Make sure the folder and its PDF files " +
                "are accessible to anyone with the link."
            );

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Couldn't load your library.";


        showError(
            error.message
        );


    } finally {

        refresh.disabled = false;

    }

}


function renderLibrary() {

    library.replaceChildren();


    const query =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const visibleBooks =
        books.filter(book => {

            const matchesSearch =
                book.name
                    .toLowerCase()
                    .includes(query);


            const matchesStar =
                !starredOnly ||
                stars.has(book.id);


            return (
                matchesSearch &&
                matchesStar
            );

        });


    if (!visibleBooks.length) {

        const message =
            document.createElement("p");

        message.textContent =
            books.length
                ? "No books match your search."
                : "";

        library.appendChild(message);

        return;

    }


    for (const book of visibleBooks) {

        const card =
            document.createElement("article");

        card.className = "card";


        const cover =
            document.createElement("div");

        cover.className = "cover";

        cover.textContent = "📖";


        const title =
            document.createElement("div");

        title.className =
            "book-title";

        title.textContent =
            book.name.replace(
                /\.pdf$/i,
                ""
            );


        const actions =
            document.createElement("div");

        actions.className =
            "card-actions";


        const openButton =
            document.createElement("button");

        openButton.textContent =
            "Read";

        openButton.addEventListener(
            "click",
            () => openBook(book)
        );


        const starButton =
            document.createElement("button");

        starButton.textContent =
            stars.has(book.id)
                ? "★"
                : "☆";

        starButton.className =
            stars.has(book.id)
                ? "starred"
                : "";


        starButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                toggleStar(book.id);

            }
        );


        actions.append(
            openButton,
            starButton
        );


        card.append(
            cover,
            title,
            actions
        );


        library.appendChild(card);

    }

}


function toggleStar(id) {

    if (stars.has(id)) {

        stars.delete(id);

    } else {

        stars.add(id);

    }


    saveStars();

    renderLibrary();

    updateReaderButtons();

}


function updateReaderButtons() {

    const book =
        books[currentIndex];

    if (!book) return;


    document.getElementById(
        "readerTitle"
    ).textContent =
        book.name;


    const starButton =
        document.getElementById(
            "bookStar"
        );


    starButton.textContent =
        stars.has(book.id)
            ? "★"
            : "☆";


    starButton.classList.toggle(
        "starred",
        stars.has(book.id)
    );


    const bookmarkButton =
        document.getElementById(
            "bookBookmark"
        );


    bookmarkButton.textContent =
        bookmarks[book.id]
            ? "🔖 Saved"
            : "🔖";


    document.getElementById(
        "prevBook"
    ).disabled =
        currentIndex <= 0;


    document.getElementById(
        "nextBook"
    ).disabled =
        currentIndex >= books.length - 1;

}


async function openBook(book) {

    const index =
        books.findIndex(
            item =>
                item.id === book.id
        );


    if (index < 0) return;


    currentIndex = index;

    page = savedPage(book);

    zoom = 1;


    reader.classList.add("active");

    document.body.style.overflow =
        "hidden";


    updateReaderButtons();


    document.getElementById(
        "zoomLabel"
    ).textContent =
        "100%";


    document.getElementById(
        "pageInfo"
    ).textContent =
        "Loading...";


    renderVersion++;

    const version =
        renderVersion;


    try {

        if (renderTask) {

            try {
                renderTask.cancel();
            } catch {}

            renderTask = null;

        }


        if (loadingTask) {

            try {
                await loadingTask.destroy();
            } catch {}

            loadingTask = null;

        }


        pdf = null;


        const url =
            "https://www.googleapis.com/drive/v3/files/" +
            encodeURIComponent(book.id) +
            "?alt=media&key=" +
            encodeURIComponent(
                GOOGLE_API_KEY
            );


        loadingTask =
            pdfjsLib.getDocument({
                url
            });


        pdf =
            await loadingTask.promise;


        if (version !== renderVersion)
            return;


        page =
            Math.max(
                1,
                Math.min(
                    page,
                    pdf.numPages
                )
            );


        document.getElementById(
            "pageNumber"
        ).max =
            pdf.numPages;


        document.getElementById(
            "pageInfo"
        ).textContent =
            "/ " + pdf.numPages;


        await renderPage();


    } catch (error) {

        console.error(error);


        if (
            version ===
            renderVersion
        ) {

            document.getElementById(
                "pageInfo"
            ).textContent =
                "Error";


            showError(
                "Couldn't open the PDF.\n\n" +
                error.message
            );

        }

    }

}


async function renderPage() {

    if (!pdf) return;


    const version =
        renderVersion;


    if (renderTask) {

        try {
            renderTask.cancel();
        } catch {}

        renderTask = null;

    }


    const pdfPage =
        await pdf.getPage(page);


    if (
        version !==
        renderVersion
    ) return;


    const viewport =
        pdfPage.getViewport({
            scale: zoom
        });


    const outputScale =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );


    canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    canvas.style.width =
        Math.floor(
            viewport.width
        ) + "px";


    canvas.style.height =
        Math.floor(
            viewport.height
        ) + "px";


    renderTask =
        pdfPage.render({

            canvasContext:
                ctx,

            viewport,

            transform:
                outputScale === 1
                    ? null
                    : [
                        outputScale,
                        0,
                        0,
                        outputScale,
                        0,
                        0
                    ]

        });


    try {

        await renderTask.promise;

    } catch (error) {

        if (
            error.name !==
            "RenderingCancelledException"
        ) {

            throw error;

        }

    }


    if (
        version !==
        renderVersion
    ) return;


    document.getElementById(
        "pageNumber"
    ).value =
        page;


    document.getElementById(
        "pageInfo"
    ).textContent =
        "/ " + pdf.numPages;


    document.getElementById(
        "prevPage"
    ).disabled =
        page <= 1;


    document.getElementById(
        "nextPage"
    ).disabled =
        page >= pdf.numPages;


    localStorage.setItem(
        "page_" +
        books[currentIndex].id,
        page
    );

}


async function changePage(amount) {

    if (!pdf) return;


    const next =
        Math.max(
            1,
            Math.min(
                pdf.numPages,
                page + amount
            )
        );


    if (next === page)
        return;


    page = next;

    await renderPage();


    document.getElementById(
        "pageArea"
    ).scrollTop = 0;

}


function closeReader() {

    renderVersion++;


    if (renderTask) {

        try {
            renderTask.cancel();
        } catch {}

        renderTask = null;

    }


    if (loadingTask) {

        try {
            loadingTask.destroy();
        } catch {}

        loadingTask = null;

    }


    pdf = null;


    reader.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


document.getElementById(
    "search"
).addEventListener(
    "input",
    renderLibrary
);


document.getElementById(
    "refresh"
).addEventListener(
    "click",
    loadBooks
);


document.getElementById(
    "starFilter"
).addEventListener(
    "click",
    () => {

        starredOnly =
            !starredOnly;


        document.getElementById(
            "starFilter"
        ).textContent =
            starredOnly
                ? "★ Starred"
                : "☆ Starred";


        renderLibrary();

    }
);


document.getElementById(
    "closeReader"
).addEventListener(
    "click",
    closeReader
);


document.getElementById(
    "prevPage"
).addEventListener(
    "click",
    () => changePage(-1)
);


document.getElementById(
    "nextPage"
).addEventListener(
    "click",
    () => changePage(1)
);


document.getElementById(
    "pageNumber"
).ad
